<!doctype html>

<head>

  <link rel="icon" type="image/svg+xml" href="/images/Swisher_Favicon.svg" />
  <style>
    :root {
      --navy: #0a192f;
      --navy-light: #12294d;
      --aqua: #4fd1c5;
      --sand: #e8d5a9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--navy);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
      background: var(--navy-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 28px;
    }

    img.logo {
      display: block;
      margin: 0 auto 24px;
      width: 200px;
      height: 113px;
      max-width: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 20px;
      color: rgba(255, 255, 255, 0.75);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a.btn {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid transparent;
    }

    a.primary {
      background: var(--aqua);
      color: var(--navy);
    }

    a.secondary {
      background: transparent;
      color: var(--sand);
      border-color: rgba(232, 213, 169, 0.5);
    }

    a.btn:hover,
    a.btn:focus-visible {
      filter: brightness(1.08);
    }

    a:focus-visible {
      outline: 3px solid var(--sand);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="/images/logo-with-mascot.png" width="200" height="113"
      alt="Swisher Plumbing, LLC" decoding="async" />

    <p>
